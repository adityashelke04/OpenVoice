[package]
name = "ov-core"
description = "OpenVoice domain core: session state machine, ports, events, config. No OS dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde = { workspace = true }
tracing.workspace = true
# Backs `redact::Redactor`. Pure computation with no OS, filesystem or network
# surface, so it does not weaken the wasm32 boundary this crate is checked
# against. Default features are kept deliberately: the patterns are hand-written
# by users in a TOML file, and trimming the Unicode tables would make perfectly
# ordinary regexes fail to compile on their machine and nowhere else.
regex.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
# Test-only: pins the JSON wire format the UI depends on. Dev-dependencies do not
# affect the wasm32 purity check.
serde_json.workspace = true
# Test-only: lets the schema migration tests parse a real settings.toml as written
# by an older build, rather than asserting against a hand-built struct that cannot
# reproduce a removed field.
toml.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

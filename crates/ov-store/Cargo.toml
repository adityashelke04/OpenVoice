[package]
name = "ov-store"
description = "OpenVoice history storage: SQLite with full-text search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ov-core.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

# `bundled` compiles SQLite from source into the binary. The alternative is
# linking whatever SQLite the machine happens to have, which for a desktop app
# shipped to strangers means a class of "works here, not there" failures that are
# miserable to diagnose remotely. The build cost is paid once.
rusqlite = { version = "0.32", features = ["bundled"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "ov-cli"
description = "OpenVoice command-line daemon and test harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ov"
path = "src/main.rs"

[dependencies]
ov-core.workspace = true
ov-format.workspace = true
ov-audio.workspace = true
ov-asr.workspace = true
ov-input.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
hound = "3.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

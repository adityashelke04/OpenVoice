[package]
name = "ov-asr"
description = "OpenVoice speech recognition: supervises the faster-whisper sidecar over newline-delimited JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ov-core.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
hound = "3.5"

[dev-dependencies]
# Test-only: backdating a file's modified time is the only way to test a
# retention window without making the test sleep for a week.
filetime = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints.rust]
missing_docs = "warn"
# Allowed only for the job-object FFI in `job.rs`, which guarantees the sidecar
# cannot outlive the app and strand GPU memory. Every block there states its
# invariant.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }

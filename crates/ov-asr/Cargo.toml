[package]
name = "ov-asr"
description = "OpenVoice speech recognition: NVIDIA Parakeet TDT, decoded in-process via sherpa-onnx."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ov-core.workspace = true
tracing.workspace = true
# The catalogue crosses the IPC boundary to the Models screen.
serde.workspace = true
hound = "3.5"
# Official k2-fsa bindings. Default features link sherpa-onnx statically, which
# is what makes the app a single binary with no DLLs beside it -- verified as an
# 18.9 MB release binary that runs from any working directory. Do not switch to
# `shared`: that trades the whole packaging premise for nothing.
sherpa-onnx = "1.13.7"

[dev-dependencies]
# Test-only, and only for the ignored end-to-end download test. ov-asr itself
# must never depend on this: it is the crate that holds the microphone, and
# scripts/check-no-network.sh proves it cannot open a socket. A dev-dependency
# is not in the shipped graph, and the guard checks `--edges normal`.
ov-fetch.workspace = true
# Test-only: backdating a file's modified time is the only way to test the
# retention window without making the test sleep for a week.
filetime = "0.2"

[lints.rust]
missing_docs = "warn"
# Forbidden, not merely denied. The only `unsafe` this crate ever held was the
# Win32 job-object FFI that stopped the Python sidecar outliving the app; with
# the sidecar gone there is none left, and the C++ that does the decoding is
# behind sherpa-onnx's safe wrapper.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

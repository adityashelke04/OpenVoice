[package]
name = "ov-fetch"
description = "OpenVoice model downloads: the only crate in the workspace that can reach the network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tracing.workspace = true
# Blocking, and small. The caller is already on a background thread, so an async
# client would add a runtime and a dependency tree to carry no benefit.
ureq = { version = "2.12", features = ["tls"] }
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.4"

[lints.rust]
missing_docs = "warn"
# This crate opens sockets and writes files the app later executes as weights.
# There is no reason for any of it to be unsafe.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "ov-app"
description = "OpenVoice desktop application: Tauri shell and composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openvoice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ov-core.workspace = true
ov-format.workspace = true
ov-audio.workspace = true
ov-asr.workspace = true
ov-input.workspace = true
ov-store.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Closing the Hub only hides it, so a second launch would otherwise start a whole
# second app: another keyboard hook on the same chord, another Flow Bar, another
# 1.6 GB model. See the plugin registration in main.rs.
tauri-plugin-single-instance = "2"
# The one deliberate outbound request OpenVoice makes that the user did not
# individually ask for. Check-only by default, disableable, and documented in
# ADR 0005 -- see `UpdateConfig` in ov-core and the allowance in
# scripts/check-no-network.sh, which names this dependency explicitly so it can
# never be mistaken for an accident.
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
] }

[lints.clippy]
all = { level = "warn", priority = -1 }

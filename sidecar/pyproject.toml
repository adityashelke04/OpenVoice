[project]
name = "openvoice-asr"
version = "0.1.0"
description = "OpenVoice ASR sidecar: faster-whisper behind a newline-delimited JSON protocol"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openvoice_asr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
